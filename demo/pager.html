<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pager Issue</title>

  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="../dist/slider.css">

  <style>
    /* Pager-specific styles */
    .demo-box {
      padding: 1.5rem;
      background-color: hsl(182, 25%, 70%);
      height: 100%;
    }

    .d-none {
      display: none;
    }

    .svg-btn-icon {
      width: 1.8rem;
      height: 1.8rem;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Lite Slider - Pager Demo</h1>
    <p>Demonstration of custom slider configurations with pager controls</p>
  </header>

  <main class="container">

    <div class="demo-section">
      <h2>Example with custom settings</h2>

      <aside class="note">
        <p>This demo shows how to configure the slider with custom responsive settings and pager controls.</p>
      </aside>

    <div class="slider2">
      <div class="slider-inner">
        <div class="slider-item"><a href="#" aria-label="Foobar"><img class="four-three" alt="" src="./images/img1.jpg"></a></div>
        <div class="slider-item"><a href="#" aria-label="Foobar"><img class="four-three" alt="" src="./images/img2.jpg"></a></div>
        <div class="slider-item"><a href="#" aria-label="Foobar"><img class="four-three" alt="" src="./images/img3.jpg"></a></div>
        <div class="slider-item"><a href="#" aria-label="Foobar"><img class="four-three" alt="" src="./images/img4.jpg"></a></div>
      </div>
      <div class="slider-pager hidden"></div>
    </div>

    </div>

  </main>

  <script type="module">

    import slider from '../index.js';

    slider();

    slider({
      container: '.slider2',
      responsive: {
        0: {
          items: 1,
          gutter: 0,
        },
        576: {
          items: 2,
          gutter: 20,
        },
        992: {
          items: 3,
          gutter: 30,
        },
      },
    });

    slider({
      container: '.slider3',
      responsive: {
        0: {
          items: 3,
          gutter: 0,
        },
        576: {
          items: 5,
          gutter: 20,
        },
        992: {
          items: 8,
          gutter: 30,
        },
      },
      hiddenClass: 'd-none',
    });

  </script>
</body>
</html>
